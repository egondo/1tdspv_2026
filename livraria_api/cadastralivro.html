<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Item</title>
    <!-- Tailwind CSS para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-gray-800 text-center">Cadastro de Livro / Produto</h1>

        <form id="meuFormulario" class="space-y-4">
            <!-- Título -->
            <div>
                <label for="titulo" class="block text-sm font-medium text-gray-700">Título</label>
                <input type="text" id="titulo" name="titulo" required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>

            <!-- Autor -->
            <div>
                <label for="autor" class="block text-sm font-medium text-gray-700">Autor</label>
                <input type="text" id="autor" name="autor" required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>

            <!-- Categoria -->
            <div>
                <label for="categoria" class="block text-sm font-medium text-gray-700">Categoria</label>
                <input type="text" id="categoria" name="categoria" required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>

            <!-- Quantidade -->
            <div>
                <label for="quantidade" class="block text-sm font-medium text-gray-700">Quantidade</label>
                <input type="number" id="quantidade" name="quantidade" required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>

            <!-- Valor -->
            <div>
                <label for="valor" class="block text-sm font-medium text-gray-700">Valor (R$)</label>
                <input type="number" step="0.01" id="valor" name="valor" required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>

            <!-- Botão de Envio -->
            <button type="submit"
                class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                Salvar
            </button>
        </form>

        <!-- Mensagem de feedback -->
        <div id="mensagem" class="mt-4 text-center text-sm font-medium"></div>
    </div>

    <script>
        document.getElementById('meuFormulario').addEventListener('submit', async function (event) {
            // Previne o comportamento padrão de recarregar a página ao enviar o formulário
            event.preventDefault();

            // Substitua pela URL da sua API ou endpoint de destino
            const urlDestino = 'https://sua-api.com/endpoint';

            // Coleta os dados dos campos do formulário
            const dados = {
                titulo: document.getElementById('titulo').value,
                autor: document.getElementById('autor').value,
                categoria: document.getElementById('categoria').value,
                // Convertendo quantidade e valor para números, se necessário
                quantidade: Number(document.getElementById('quantidade').value),
                valor: Number(document.getElementById('valor').value)
            };

            const divMensagem = document.getElementById('mensagem');
            divMensagem.textContent = 'Enviando...';
            divMensagem.className = 'mt-4 text-center text-sm font-medium text-gray-600';

            try {
                // Realiza a requisição POST utilizando a Fetch API
                const resposta = await fetch(urlDestino, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(dados) // Transforma o objeto JavaScript em string JSON
                });

                if (resposta.ok) {
                    divMensagem.textContent = 'Dados enviados com sucesso!';
                    divMensagem.className = 'mt-4 text-center text-sm font-medium text-green-600';
                    document.getElementById('meuFormulario').reset(); // Limpa o formulário
                } else {
                    throw new Error('Erro ao enviar os dados.');
                }
            } catch (erro) {
                console.error('Erro:', erro);
                divMensagem.textContent = 'Erro ao conectar com o servidor.';
                divMensagem.className = 'mt-4 text-center text-sm font-medium text-red-600';
            }
        });
    </script>

</body>

</html>
